name: Build iOS with EAS
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build iOS
        run: npx eas-cli@latest build --platform ios --non-interactive --wait

      - name: Download IPA
        run: |
          BUILD_URL=$(npx eas-cli@latest build:list --platform ios --limit 1 --status finished --json | jq -r '.[0].artifacts.buildUrl')
          curl -L -o birthday-friends.ipa "$BUILD_URL"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: birthday-friends.ipa
          tag_name: v${{ github.run_number }} # Nombre del release v1, v2, v3
